name: youtube
# YouTube Shorts for 스피드랙온라인지점, paced by the "youtube" list in schedule.json.
# Paused until SY approves the schedule and the YouTube API audit is passed (uploads are private before that).
on:
  # schedule:   # KST 08,09,10,12,14,15,18,20,21 (+5 min)
  #   - cron: "5 23,0,1,3,5,6,9,11,12 * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "youtube entry id (blank = whatever is due now)"
        required: false
permissions:
  contents: write
concurrency: youtube
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload due Shorts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/youtube.py ${{ inputs.id && format('--id {0}', inputs.id) || '' }}
      - name: Record uploads
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f youtube.json ] || echo '[]' > youtube.json
          git add youtube.json
          git diff --cached --quiet || (git commit -m "Record YouTube uploads" && git pull --rebase && git push)
